# Single source of truth for training, evaluation, inference and serving.
# Override any value from CLI: python src/train.py --config configs/yolov8s.yaml --epochs 80
# CLI flags always win over the yaml.

data:
  yaml: data/raw/data.yaml   # generated by scripts/prepare_data.py
  nc: 18                     # update if merge_export.py adds classes

train:
  model: yolov8n.pt           # yolov8n.pt | yolov8s.pt | yolo11n.pt | yolo11s.pt
  epochs: 50
  imgsz: 640                 # 960 if nano misses small items (see EDA)
  batch: 16
  patience: 15               # early stopping
  close_mosaic: 10           # disable mosaic for last N epochs
  device: null               # null = auto (cuda if available else cpu)
  project: runs/detect
  name: train
  mlflow_experiment: fresh-fruit-yolo

evaluate:
  weights: runs/detect/train/weights/best.pt
  imgsz: 640
  target_map50: 0.579        # beat published YOLOv8s baseline
  target_rotten_recall: 0.85

predict:
  weights: runs/detect/train/weights/best.pt
  conf: 0.35
  save: pred_basket.jpg

api:
  conf: 0.35
  host: 0.0.0.0
  port: 8000
